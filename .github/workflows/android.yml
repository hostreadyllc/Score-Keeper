name: Android build

# Builds the Score Keeper Android app and posts it on the repo's Releases page.
# With the four signing secrets set, it produces a Play Store bundle (.aab) and an installable APK.
# Without them, it produces a test APK only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Copy the web app into the Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html fonts icons android/app/src/main/assets/www/

      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SK_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not set, so only a test APK will be built."
          fi

      - name: Build
        working-directory: android
        env:
          SK_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SK_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "$SIGNED" = "1" ]; then
            gradle --no-daemon bundleRelease assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect the files
        run: |
          mkdir -p out
          if [ "$SIGNED" = "1" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab out/score-keeper.aab
            cp android/app/build/outputs/apk/release/app-release.apk out/score-keeper.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/score-keeper-test.apk
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: score-keeper-android
          path: out/*

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Score Keeper 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Package name: com.hostreadyllc.scorekeeper
            Version code: ${{ github.run_number }}

            - score-keeper.aab: upload this to Google Play Console
            - score-keeper.apk: install directly on an Android phone
            - score-keeper-test.apk: test build, shown when signing secrets are not set
          files: out/*
